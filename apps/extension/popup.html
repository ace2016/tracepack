<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracepack capture</title><style>body{font:14px system-ui;width:320px;margin:0;padding:20px;color:#18231d;background:#f7f4ec}h1{font-size:20px;margin:0 0 8px}p{line-height:1.45;color:#536158}button{width:100%;border:0;border-radius:10px;padding:12px;background:#1f5b40;color:white;font-weight:700;cursor:pointer;margin-top:8px}button:first-of-type{margin-top:0}button.secondary{background:#e7ecdf;color:#1f5b40}button:disabled{opacity:.55}.status{min-height:20px;font-size:12px}a.secondary{display:block;text-align:center;text-decoration:none;box-sizing:border-box}#captureThumb{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid #d9ddd6;margin-top:4px}[hidden]{display:none}.pack-picker-label{margin:14px 0 6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#7c887f}.pack-btn{background:#fff;color:#18231d;border:1px solid #d9ddd6;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}.pack-btn:hover{border-color:#1f5b40}.pack-btn .pack-count{color:#7c887f;font-weight:600;font-size:12px;flex-shrink:0}</style></head><body>
<div id="captureView"><h1>Capture this page</h1><p>Save this page, its URL, title and capture time to your local Tracepack workspace.</p><button id="capture">Capture visible page</button><button id="captureFull" class="secondary">Capture full page (scrolls &amp; stitches)</button><p class="status" id="status" role="status"></p></div>
<div id="ownPageView" hidden><h1>Nothing to capture here</h1><p>This isn't a page Tracepack can capture. Open the workspace instead to add files or write a note directly.</p><button id="openWorkspace">Open Tracepack workspace</button></div>
<div id="doneView" hidden><h1>Capture complete</h1><img id="captureThumb" alt="Preview of the captured page"><p class="status" role="status" id="doneStatus"></p><a id="downloadCapture" class="secondary" href="#" download="tracepack-capture.png">Download image</a><div id="packPicker" hidden><p class="pack-picker-label">Add to a pack</p><div id="packList"></div></div><button id="openWorkspaceFromDone">Add to a Tracepack project</button><button id="captureAnother" class="secondary">Capture another page</button></div>
<script type="module" src="/src/popup.ts"></script></body></html>
