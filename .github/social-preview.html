<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: #1d3c2d;
    font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 1280px;
    height: 640px;
    background:
      radial-gradient(760px 520px at 88% 8%, rgba(213, 246, 107, 0.10), transparent 60%),
      radial-gradient(900px 620px at 8% 100%, rgba(0, 0, 0, 0.22), transparent 55%),
      linear-gradient(160deg, #204331 0%, #1d3c2d 46%, #162e21 100%);
  }
  /* faint corner brackets, evidence-page motif */
  .bracket {
    position: absolute;
    width: 46px;
    height: 46px;
    border: 2.5px solid rgba(213, 246, 107, 0.38);
  }
  .bracket.tl { top: 44px; left: 44px; border-right: none; border-bottom: none; }
  .bracket.br { bottom: 44px; right: 44px; border-left: none; border-top: none; }

  .content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  .mark {
    width: 92px;
    height: 92px;
    margin-bottom: 30px;
  }
  .wordmark {
    font-size: 68px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #fffef9;
    line-height: 1;
    margin-bottom: 22px;
  }
  .tagline {
    font-size: 25px;
    font-weight: 400;
    color: rgba(255, 254, 249, 0.82);
    line-height: 1.5;
    max-width: 760px;
    margin-bottom: 34px;
  }
  .chips {
    display: flex;
    gap: 12px;
  }
  .chip {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1d3c2d;
    background: #d5f66b;
    padding: 9px 16px;
    border-radius: 999px;
  }
  .chip.outline {
    color: #d5f66b;
    background: transparent;
    border: 1.5px solid rgba(213, 246, 107, 0.55);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bracket tl"></div>
    <div class="bracket br"></div>
    <div class="content">
      <svg class="mark" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M34 18 H66 A10 10 0 0 1 76 28 V72 A10 10 0 0 1 66 82 H34 A10 10 0 0 1 24 72 V28 A10 10 0 0 1 34 18 Z" fill="#d5f66b"></path>
        <path d="M41 44 A9 9 0 1 1 59 44 A9 9 0 1 1 41 44 Z" fill="#1d3c2d"></path>
        <path d="M49 50 H51 A3 3 0 0 1 54 53 V65 A3 3 0 0 1 51 68 H49 A3 3 0 0 1 46 65 V53 A3 3 0 0 1 49 50 Z" fill="#1d3c2d"></path>
      </svg>
      <div class="wordmark">Tracepack</div>
      <div class="tagline">Build an evidence pack from your own files. Local-first, no accounts, nothing uploaded until you export it.</div>
      <div class="chips">
        <span class="chip">Privacy scan</span>
        <span class="chip outline">Chronology</span>
        <span class="chip outline">Local export</span>
      </div>
    </div>
  </div>
</body>
</html>
