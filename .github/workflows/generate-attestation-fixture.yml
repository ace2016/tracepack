name: Generate attestation fixture

on:
  pull_request:
    paths:
      - "packages/attestation/**"
      - "packages/attestation-sigstore/**"
      - ".github/workflows/generate-attestation-fixture.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck attestation Sigstore package
        run: pnpm --filter @tracepack/attestation-sigstore typecheck

      - name: Generate real TracePack attestation fixture
        working-directory: packages/attestation-sigstore
        run: pnpm exec tsx scripts/generate-attestation-fixture.ts

      - name: Verify TracePack attestation fixture
        working-directory: packages/attestation-sigstore
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            verifyAttestationWithSigstore,
          } from "./src/verify-attestation.ts";

          const attestation =
            JSON.parse(
              fs.readFileSync(
                "fixture-output/attestation.sigstore.json",
                "utf8",
              ),
            );

          const result =
            await verifyAttestationWithSigstore(
              attestation,
              {
                certificateIssuer:
                  attestation.statement
                    .signer
                    .expected_identity
                    .issuer,

                certificateIdentityURI:
                  attestation.statement
                    .signer
                    .expected_identity
                    .subject,
              },
            );

          if (!result.valid) {
            throw new Error(
              "TracePack attestation verification failed.",
            );
          }

          console.log(
            "TRACEPACK_ATTESTATION_VERIFIED",
          );

          console.log(
            JSON.stringify(
              {
                issuer:
                  result.verified_identity
                    .issuer,

                subject:
                  result.verified_identity
                    .subject,

                identityBinding:
                  result.identity_binding,

                statementType:
                  result.attestation
                    .statement
                    .statement
                    .type,

                subjectDigest:
                  result.attestation
                    .statement
                    .subject
                    .digest
                    .value,
              },
              null,
              2,
            ),
          );
          NODE

      - name: Upload fixture
        uses: actions/upload-artifact@v4
        with:
          name: tracepack-attestation-sigstore-fixture
          path: |
            packages/attestation-sigstore/fixture-output/attestation-statement.json
            packages/attestation-sigstore/fixture-output/attestation-payload.bin
            packages/attestation-sigstore/fixture-output/attestation.sigstore.json
          if-no-files-found: error
          retention-days: 7
