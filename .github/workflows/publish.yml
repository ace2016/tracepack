name: Publish verified developer packages

on:
  push:
    tags:
      - "developer-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing developer release tag to recover"
        required: true
        default: "developer-v0.2.0"

concurrency:
  group: tracepack-developer-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'ace2016/tracepack'
    runs-on: ubuntu-latest
    environment: npm-production
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use a trusted publishing capable npm client
        run: npm install --global npm@latest

      - name: Install exactly the reviewed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source, tests and package metadata
        env:
          TRACEPACK_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: pnpm run release:check

      - name: Create the reviewed package archives
        run: |
          mkdir release-packages
          pnpm --filter @tracepack/evidence-core pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @tracepack/template-engine pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @tracepack/evidence-sdk pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @tracepack/integration pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @tracepack/cli pack --pack-destination "$GITHUB_WORKSPACE/release-packages"

      - name: Test the archives in a clean project
        run: |
          mkdir release-smoke
          cd release-smoke
          npm init --yes
          npm install ../release-packages/tracepack-evidence-core-*.tgz \
            ../release-packages/tracepack-template-engine-*.tgz \
            ../release-packages/tracepack-evidence-sdk-*.tgz \
            ../release-packages/tracepack-integration-*.tgz \
            ../release-packages/tracepack-cli-*.tgz
          node --input-type=module -e "Promise.all([import('@tracepack/evidence-core'), import('@tracepack/template-engine'), import('@tracepack/evidence-sdk'), import('@tracepack/integration')]).then(() => console.log('SDK imports passed'))"
          ./node_modules/.bin/tracepack --help

      - uses: sigstore/cosign-installer@v3.10.0

      - name: Sign and verify each archive with Sigstore
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          for package in release-packages/*.tgz; do
            cosign sign-blob --yes --bundle "${package}.sigstore.json" "$package"
            cosign verify-blob \
              --bundle "${package}.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
              "$package"
          done

      - name: Create release checksums
        working-directory: release-packages
        run: sha256sum *.tgz *.sigstore.json > SHA256SUMS

      - name: Preserve signed archives before publication
        uses: actions/upload-artifact@v4
        with:
          name: tracepack-developer-packages-${{ env.RELEASE_TAG }}
          path: |
            release-packages/*.tgz
            release-packages/*.sigstore.json
            release-packages/SHA256SUMS
          if-no-files-found: error

      - name: Publish with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          for package in \
            release-packages/tracepack-evidence-core-*.tgz \
            release-packages/tracepack-template-engine-*.tgz \
            release-packages/tracepack-evidence-sdk-*.tgz \
            release-packages/tracepack-integration-*.tgz \
            release-packages/tracepack-cli-*.tgz
          do
            metadata=$(tar -xOzf "./$package" package/package.json)
            package_name=$(printf '%s' "$metadata" | node -e "let s='' ; process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).name))")
            package_version=$(printf '%s' "$metadata" | node -e "let s='' ; process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "Already published: ${package_name}@${package_version}. Skipping."
            else
              npm publish "./$package" --access public --provenance
            fi
          done

      - name: Attach the verified files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "Tracepack developer packages $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" --clobber \
            release-packages/*.tgz \
            release-packages/*.sigstore.json \
            release-packages/SHA256SUMS
