  - id: photos_and_media
    name: Photos and media
    requirement: recommended
    description: Photos, screenshots or other visual evidence.
    accepted_types: [image, webpage]
  - id: correspondence
    name: Correspondence
    requirement: optional
    description: Messages, emails or other communication relevant to this record.
    accepted_types: [pdf, image, webpage, note]
