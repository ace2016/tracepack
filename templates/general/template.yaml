version: 0.1.0
jurisdiction: general
intake:
  summary_label: Summary
  summary_placeholder: Describe what this record is for and why you're building it.
  resolution_label: Notes
  resolution_placeholder: Any other context worth recording.
categories:
  - id: documents
    name: Documents
    requirement: recommended
    description: Any documents relevant to this record.
